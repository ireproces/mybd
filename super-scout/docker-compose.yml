# Il nome del progetto non va dedotto dalla cartella: fissa container, rete,
# immagine e volumi su 'super-scout' indipendentemente da dove sia il repository.
name: super-scout

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: super-scout-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-super-scout-dev}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_memory_transaction_total_max: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # L'API non deve partire prima che il database accetti query.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-super-scout-dev} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  api:
    build: .
    container_name: super-scout-api
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
      # Jupyter, per il notebook di analisi (avviato a mano quando serve):
      #   docker compose exec api pip install -r notebooks/requirements.txt
      #   docker compose exec api jupyter lab --ip 0.0.0.0 --port 8888 --no-browser --allow-root
      - "8888:8888"
    environment:
      # Dentro la rete di compose il database si raggiunge per nome di servizio.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-super-scout-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      # Il dataset resta sull'host: l'immagine non lo contiene.
      - ./data:/app/data

volumes:
  neo4j_data:
  neo4j_logs:
